# Wakes the backend every 30 minutes to run scheduled work (Phase 10):
# lock check-ins at 09:00 IST, retention clean-up, and the 20:00 IST teacher digest.
# The free Render instance sleeps when idle, so an in-process timer alone is not enough.
# Needs the repository secret JOBS_SECRET (same value as on Render).
name: Scheduled jobs

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run backend jobs
        env:
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          if [ -z "$JOBS_SECRET" ]; then
            echo "JOBS_SECRET is not set in the repository secrets"; exit 1
          fi
          # Long timeout + retries: a sleeping Render instance takes ~1 minute to wake.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "x-jobs-secret: $JOBS_SECRET" \
            https://capstone-7th-sem.onrender.com/api/v1/jobs/run
